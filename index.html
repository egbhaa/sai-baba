<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Baba">

<title>ॐ Sai Baba</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  min-height: 100vh;
  background: linear-gradient(160deg,#1a0a00 0%,#2d1200 30%,#1a0800 60%,#0d0500 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 40px;
  font-family: Georgia, 'Palatino Linotype', serif;
  overflow-x: hidden;
}

/* ── Animations ── */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
@keyframes petals {
  0%   { transform: translateY(-10px) rotate(0deg);  opacity:0; }
  8%   { opacity:.85; }
  100% { transform: translateY(105vh) rotate(380deg); opacity:0; }
}
@keyframes flamePulse {
  0%,100% { transform: scaleX(1)    scaleY(1)    rotate(-1deg); }
  25%     { transform: scaleX(.85)  scaleY(1.12) rotate(2deg);  }
  50%     { transform: scaleX(1.08) scaleY(.92)  rotate(-2deg); }
  75%     { transform: scaleX(.9)   scaleY(1.08) rotate(1deg);  }
}
@keyframes innerFlame {
  0%,100% { transform: scaleX(1)   scaleY(1);    }
  33%     { transform: scaleX(.8)  scaleY(1.15); }
  66%     { transform: scaleX(1.1) scaleY(.88);  }
}
@keyframes glowPulse {
  0%,100% { filter: drop-shadow(0 0 8px  rgba(255,160,30,.85)) drop-shadow(0 0 22px rgba(255,100,10,.4));  }
  50%     { filter: drop-shadow(0 0 15px rgba(255,190,50,1))   drop-shadow(0 0 38px rgba(255,130,20,.55)); }
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes blessingAnim {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.88); }
  15%  { opacity:1; transform:translate(-50%,-50%) scale(1);   }
  82%  { opacity:1; transform:translate(-50%,-50%) scale(1);   }
  100% { opacity:0; transform:translate(-50%,-50%) scale(.96); }
}

/* ── Pétales fixes ── */
.petal {
  position: fixed; top: 0; font-size: 15px;
  pointer-events: none; z-index: 0;
  animation: petals linear infinite;
  opacity: 0;
  transition: opacity 1s;
}
.petal.visible { opacity: 1; }
.petal:nth-child(1) { left:12%; animation-duration:4s;   animation-delay:0s;   }
.petal:nth-child(2) { left:29%; animation-duration:4.7s; animation-delay:1.3s; }
.petal:nth-child(3) { left:46%; animation-duration:5.5s; animation-delay:2.6s; }
.petal:nth-child(4) { left:63%; animation-duration:6.3s; animation-delay:3.9s; }
.petal:nth-child(5) { left:80%; animation-duration:7.1s; animation-delay:5.2s; }

/* ── Portrait ── */
#portrait-wrap {
  margin-top: 22px;
  z-index: 2;
  animation: float 5s ease-in-out infinite;
  will-change: transform;
  position: relative;
  display: inline-flex;
}
.portrait-halo {
  position: absolute; inset: -24px; border-radius: 50%;
  background: radial-gradient(circle,rgba(180,130,40,.08) 0%,transparent 68%);
  transition: background 1.5s ease;
  pointer-events: none;
}
.portrait-halo.lit {
  background: radial-gradient(circle,rgba(255,210,80,.28) 0%,rgba(255,150,20,.10) 55%,transparent 72%);
}
.portrait-frame {
  border-radius: 10px; padding: 5px;
  background: linear-gradient(135deg,#b8860b,#ffd700,#8b6914,#ffd700,#b8860b);
  box-shadow: 0 8px 28px rgba(0,0,0,.6);
  transition: box-shadow 1.2s ease;
}
.portrait-frame.lit {
  box-shadow: 0 0 32px 10px rgba(255,175,35,.4), 0 8px 30px rgba(0,0,0,.7);
}
.portrait-inner {
  border-radius: 6px; overflow: hidden; width: 224px; height: 236px;
}
.portrait-inner img {
  width:100%; height:100%; object-fit:cover; object-position:center top;
  display:block;
  filter: brightness(0.86) contrast(0.95);
  transition: filter 1.3s ease;
}
.portrait-inner img.lit { filter: brightness(1.08) contrast(1.02); }
.portrait-corner {
  position: absolute; font-size: 17px; pointer-events: none;
}

/* ── Bandeau spécial ── */
#special-banner {
  width: calc(100% - 32px);
  margin: 12px 16px 0;
  padding: 11px 16px;
  background: linear-gradient(135deg,rgba(180,100,0,.5),rgba(120,60,0,.4));
  border: 1px solid rgba(255,180,50,.4);
  border-radius: 12px;
  text-align: center;
  animation: fadeInUp .6s ease-out both;
  z-index: 2;
  display: none;
}

/* ── Offrandes ── */
#offerings {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 14px;
  margin-top: 14px;
  z-index: 2;
  width: 100%;
}

/* ── Bougie ── */
#candle-btn {
  background: none; border: none; cursor: pointer;
  padding: 4px 8px;
  display: flex; flex-direction: column; align-items: center;
}
.candle-body {
  display: flex; flex-direction: column; align-items: center;
}
.wick { width:3px; height:18px; background:linear-gradient(to bottom,#555,#222); border-radius:2px; }
.candle-wax-off { width:16px; height:58px; background:linear-gradient(to bottom,#d4a060,#a07040); border-radius:50% 50% 40% 40%; }
.candle-base-off { width:28px; height:8px; background:linear-gradient(to bottom,#c89030,#7a5010); border-radius:0 0 5px 5px; }

.flame-wrap { animation: glowPulse 2s ease-in-out infinite; display:flex; flex-direction:column; align-items:center; }
.flame-outer {
  width:28px; height:52px;
  background: linear-gradient(to top,#ff8c00,#ff5500,#ff2200,#ff6600 40%,#ffcc00 70%,#fff8d0 100%);
  border-radius: 50% 50% 30% 30%/60% 60% 40% 40%;
  animation: flamePulse 1.4s ease-in-out infinite;
  transform-origin: bottom center;
  position: relative;
}
.flame-inner {
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  width:12px; height:28px;
  background: linear-gradient(to top,#4488ff,#88aaff,#ccddff);
  border-radius: 50% 50% 30% 30%/60% 60% 40% 40%;
  animation: innerFlame 1s ease-in-out infinite;
  transform-origin: bottom center; opacity:.8;
}
.candle-wick-lit { width:3px; height:14px; background:linear-gradient(to bottom,#333,#111); border-radius:2px; }
.candle-wax-lit {
  width:20px; height:62px;
  background: linear-gradient(to bottom,#fffbe8,#f5e8c0,#e8d090);
  border-radius: 4px 4px 2px 2px; position:relative; overflow:hidden;
}
.candle-wax-lit::after {
  content:''; position:absolute; left:3px; top:0; width:2px; height:100%;
  background:rgba(255,255,255,.4); border-radius:1px;
}
.candle-dish { width:34px; height:9px; background:linear-gradient(to bottom,#d4a040,#8b6020); border-radius:0 0 5px 5px; }

/* ── Label bougie ── */
#candle-label {
  font-size:12px; letter-spacing:1px; margin-top:6px;
  color:#907050; transition:color .6s; text-align:center; z-index:2;
}

/* ── Bénédiction ── */
#blessing {
  position:fixed; top:50%; left:50%;
  background: linear-gradient(135deg,rgba(70,25,0,.97),rgba(35,12,0,.97));
  border: 1px solid rgba(255,175,50,.5);
  border-radius:16px; padding:20px 26px; text-align:center;
  animation: blessingAnim 3.5s ease forwards;
  z-index:100; max-width:275px;
  box-shadow: 0 0 40px rgba(255,145,25,.3);
  display:none;
}

/* ── Encens SVG ── */
.incense svg { overflow: visible; }

/* ── Mantra ── */
#mantra { margin-top:22px; text-align:center; z-index:2; }
</style>
</head>

<script>
const SACRED_DAYS = {
  "01-14":"Makar Sankranti 🌟","02-26":"Maha Shivaratri 🔱","03-30":"Holi 🌈",
  "04-06":"Rama Navami 🌺","04-14":"Hanuman Jayanti 🐒","07-10":"Guru Purnima 🌕",
  "08-29":"Ganesh Chaturthi 🐘","10-02":"Navaratri commence ✨",
  "10-15":"Mahasamadhi de Shirdi Sai Baba 🕉️","10-20":"Dussehra ⭐",
  "10-31":"Diwali 🪔","11-19":"Guru Nanak Jayanti 🙏",
  "12-25":"Noël — Baba embrasse toutes les religions ✝️"
};

function getTodayKey() {
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function getStorageKey() {
  const d = new Date();
  return "sai-candle-"+d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
}

// ── Init date & jours spéciaux ──
(function initDate() {
  const now = new Date();
  const days = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  const dateStr = now.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("date-line").textContent = days[now.getDay()]+" "+dateStr;

  const isThursday = now.getDay() === 4;
  const feast = SACRED_DAYS[getTodayKey()];
  if (isThursday || feast) {
    document.getElementById("special-banner").style.display = "block";
    if (isThursday) document.getElementById("thursday-msg").style.display = "block";
    if (feast) {
      const el = document.getElementById("feast-msg");
      el.textContent = "✨ Fête sacrée : "+feast;
      el.style.display = "block";
      el.style.marginTop = isThursday ? "6px" : "0";
    }
  }
})();

// ── État bougie ──
let candleLit = false;
let blessingTimer = null;

function setLit(lit) {
  candleLit = lit;

  // Bougie
  document.getElementById("candle-off").style.display = lit ? "none"  : "flex";
  document.getElementById("candle-on").style.display  = lit ? "flex"  : "none";

  // Encens
  document.getElementById("incense-left-lit").style.display  = lit ? "block" : "none";
  document.getElementById("incense-right-lit").style.display = lit ? "block" : "none";

  // Portrait
  document.getElementById("portrait-halo").classList.toggle("lit", lit);
  document.getElementById("portrait-frame").classList.toggle("lit", lit);
  document.getElementById("portrait-img").classList.toggle("lit", lit);

  // Pétales
  document.querySelectorAll(".petal").forEach(p => p.classList.toggle("visible", lit));

  // Label
  document.getElementById("candle-label").textContent = lit
    ? "🪔 Bougie allumée · tapez pour éteindre"
    : "Tapez la bougie pour l'allumer";
  document.getElementById("candle-label").style.color = lit ? "#ffd080" : "#907050";
}

function toggleCandle() {
  const next = !candleLit;
  setLit(next);
  try {
    next ? localStorage.setItem(getStorageKey(),"lit") : localStorage.removeItem(getStorageKey());
  } catch(e) {}
  if (next) showBlessing();
}

function showBlessing() {
  const el = document.getElementById("blessing");
  el.style.display = "block";
  el.style.animation = "none";
  void el.offsetWidth; // reflow pour relancer l'animation
  el.style.animation = "blessingAnim 3.5s ease forwards";
  clearTimeout(blessingTimer);
  blessingTimer = setTimeout(() => { el.style.display = "none"; }, 3500);
}

// ── Restore état du jour ──
(function restoreState() {
  try {
    if (localStorage.getItem(getStorageKey()) === "lit") setLit(true);
  } catch(e) {}
})();
</script>
